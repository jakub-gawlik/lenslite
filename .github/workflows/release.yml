name: Release

# Runs only after CI has passed on main, so the checks aren't repeated here.
# Publishing still runs prepublishOnly (lint, types, coverage, build, size)
# against the exact tree being published.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}

permissions:
  contents: write # push the version commit and git tags, create releases
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which trusted publishing requires.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # With pending changesets: opens/updates the "Version Packages" PR.
      # Once that PR is merged (no changesets left): publishes to npm with
      # provenance, pushes the vX.Y.Z tag and creates a GitHub release.
      - uses: changesets/action@v2
        with:
          version-script: npx changeset version
          publish-script: npm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: true
        env:
          # Only used if trusted publishing isn't configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
